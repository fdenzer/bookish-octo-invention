<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FritzStream - Camera Feed</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f6f8fa;
            padding: 20px;
        }
        h1 {
            color: #24292e;
            margin-bottom: 20px;
        }
        .stream-container {
            border: 4px solid #24292e;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        img {
            display: block;
            max-width: 100%;
            height: auto;
            min-width: 320px;
            min-height: 240px;
        }
        .config {
            margin-top: 30px;
            font-size: 0.9em;
            color: #586069;
            text-align: center;
        }
        button {
            background-color: #2ea44f;
            border: 1px solid rgba(27, 31, 35, 0.15);
            border-radius: 6px;
            box-shadow: rgba(27, 31, 35, 0.04) 0 1px 0;
            color: #fff;
            cursor: pointer;
            display: inline-block;
            font-weight: 500;
            padding: 5px 16px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2c974b;
        }
        code {
            background-color: rgba(27, 31, 35, 0.05);
            padding: 2px 4px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h1>FritzStream</h1>
    <div class="stream-container">
        <!-- The camera stream is an MJPEG feed -->
        <img id="stream" src="http://camera.local:81/stream" alt="Camera Stream" />
    </div>
    <div class="config">
        <p>Current stream source: <code id="current-url">http://camera.local:81/stream</code></p>
        <button onclick="updateUrl()">Update Stream URL</button>
        <p><small>Tip: Use your public MyFRITZ! or DynDNS address here.</small></p>
    </div>

    <script>
        function updateUrl() {
            const currentUrl = document.getElementById('stream').src;
            const newUrl = prompt('Enter the public URL of your MJPEG stream (e.g., http://your-id.myfritz.net:81/stream):', currentUrl);
            if (newUrl && newUrl.trim() !== "") {
                document.getElementById('stream').src = newUrl;
                document.getElementById('current-url').textContent = newUrl;
                localStorage.setItem('fritzStreamUrl', newUrl);
            }
        }

        // Load saved URL from localStorage
        const savedUrl = localStorage.getItem('fritzStreamUrl');
        if (savedUrl) {
            document.getElementById('stream').src = savedUrl;
            document.getElementById('current-url').textContent = savedUrl;
        }
    </script>
</body>
</html>
