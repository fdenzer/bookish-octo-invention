<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FritzStream - Camera Feed</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f6f8fa;
            padding: 20px;
        }
        h1 {
            color: #24292e;
            margin-bottom: 10px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .status-connecting { background-color: #f1e05a; color: #000; }
        .status-online { background-color: #2ea44f; color: #fff; }
        .status-error { background-color: #d73a49; color: #fff; }

        .stream-container {
            border: 4px solid #24292e;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
        }
        img {
            display: block;
            max-width: 100%;
            height: auto;
            min-width: 320px;
            min-height: 240px;
        }
        .metadata {
            margin-top: 10px;
            font-family: monospace;
            font-size: 0.85em;
            color: #6a737d;
        }
        .config {
            margin-top: 30px;
            font-size: 0.9em;
            color: #586069;
            text-align: center;
            max-width: 500px;
        }
        .controls {
            margin-bottom: 15px;
        }
        select, button {
            background-color: #fafbfc;
            border: 1px solid rgba(27, 31, 35, 0.15);
            border-radius: 6px;
            box-shadow: rgba(27, 31, 35, 0.04) 0 1px 0;
            color: #24292e;
            cursor: pointer;
            display: inline-block;
            font-weight: 500;
            padding: 5px 12px;
            font-size: 0.9em;
        }
        button.primary {
            background-color: #2ea44f;
            color: #fff;
        }
        button:hover {
            background-color: #f3f4f6;
        }
        button.primary:hover {
            background-color: #2c974b;
        }
        code {
            background-color: rgba(27, 31, 35, 0.05);
            padding: 2px 4px;
            border-radius: 3px;
            word-break: break-all;
        }
        .error-log {
            color: #d73a49;
            margin-top: 10px;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <h1>FritzStream</h1>
    <div id="status" class="status-badge status-connecting">Connecting</div>

    <div class="stream-container">
        <img id="stream" src="" alt="Camera Stream" />
    </div>

    <div class="metadata" id="metadata">
        Resolution: Checking...
    </div>

    <div class="config">
        <div class="controls">
            <label for="stream-select">Stream Source:</label>
            <select id="stream-select" onchange="changeStream()">
                <option value="custom">My Camera (Custom)</option>
                <option value="poc">PoC: Traffic Camera (Fallback)</option>
            </select>
            <button onclick="updateUrl()">Edit URL</button>
        </div>

        <p>Source: <code id="current-url">Loading...</code></p>
        <div id="error-info" class="error-log"></div>

        <p><small>Tip: Use your public MyFRITZ! or DynDNS address for "My Camera".</small></p>
    </div>

    <script>
        const POC_URL = "http://64.191.148.57/mjpg/video.mjpg";
        const DEFAULT_LOCAL = "http://camera.local:81/stream";

        const streamImg = document.getElementById('stream');
        const statusBadge = document.getElementById('status');
        const metadataDiv = document.getElementById('metadata');
        const currentUrlCode = document.getElementById('current-url');
        const streamSelect = document.getElementById('stream-select');
        const errorInfo = document.getElementById('error-info');

        function setStatus(status, message) {
            statusBadge.className = 'status-badge status-' + status;
            statusBadge.textContent = message || status;
        }

        function updateMetadata() {
            if (streamImg.naturalWidth) {
                metadataDiv.textContent = `Resolution: ${streamImg.naturalWidth} x ${streamImg.naturalHeight}`;
                setStatus('online', 'Live');
            }
        }

        streamImg.onload = () => {
            updateMetadata();
            errorInfo.textContent = "";
        };

        streamImg.onerror = () => {
            setStatus('error', 'Offline');
            metadataDiv.textContent = "Resolution: Unknown";
            checkError(streamImg.src);
        };

        async function checkError(url) {
            try {
                // Fetch might fail due to CORS, but we try to get some info
                const response = await fetch(url, { mode: 'no-cors' });
                // With no-cors, we can't see the status, but if it throws, we know it's a network error
                errorInfo.textContent = "Could not connect to the stream. Check if the URL is correct and accessible from your network.";
            } catch (e) {
                errorInfo.textContent = "Network error: " + e.message;
            }
        }

        function loadStream(url, type) {
            setStatus('connecting', 'Connecting...');
            streamImg.src = url;
            currentUrlCode.textContent = url;
            streamSelect.value = type;
        }

        function changeStream() {
            const type = streamSelect.value;
            if (type === 'poc') {
                loadStream(POC_URL, 'poc');
            } else {
                const savedUrl = localStorage.getItem('fritzStreamUrl') || DEFAULT_LOCAL;
                loadStream(savedUrl, 'custom');
            }
        }

        function updateUrl() {
            const currentUrl = localStorage.getItem('fritzStreamUrl') || DEFAULT_LOCAL;
            const newUrl = prompt('Enter the public URL of your MJPEG stream:', currentUrl);
            if (newUrl && newUrl.trim() !== "") {
                localStorage.setItem('fritzStreamUrl', newUrl.trim());
                if (streamSelect.value === 'custom') {
                    loadStream(newUrl.trim(), 'custom');
                }
            }
        }

        // Initialize
        const savedUrl = localStorage.getItem('fritzStreamUrl') || DEFAULT_LOCAL;
        loadStream(savedUrl, 'custom');

        // Periodically check metadata in case onload didn't fire (sometimes happens with MJPEG)
        setInterval(updateMetadata, 2000);
    </script>
</body>
</html>
